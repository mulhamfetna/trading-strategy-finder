[pytest]
# Tests reference CSV fixtures by relative bare filenames, so pytest must
# be run from the repo root. Placing this file at the repo root pins the
# rootdir automatically.
testpaths = tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:pandas.*

# NEVER collect the harvested server archive (#94). It contains 19 `test_*.py` files that are
# HISTORICAL COPIES — old code, kept as the provenance of a finished result, pinning champion values
# and APIs that have since moved. Collecting them runs a June/July tree against today's engine.
#
# Found the hard way: after the harvest landed, the full suite went from 2m39s to hung-with-no-output
# for 17 minutes. The archive is a record, not a test suite.
# Patterns are fnmatched against the directory BASENAME, not the path — a full path here would
# silently never match, which is precisely the failure mode this whole issue is about.
#
# `legacy18` is a nested GIT WORKTREE (branch research/legacy-18-baseline), not a subproject. It is a
# second full checkout of this same repo living inside the working tree, so without this entry pytest
# collects EVERY test twice under the same module names and dies at collection:
#     Interrupted: 1 error during collection
# — measured, not hypothetical. It aborts the whole run, so the suite stops working entirely rather
# than merely slowing down.
norecursedirs = server-audit shareable .git node_modules __pycache__ *.rsync-retired-* legacy18
