[pytest]
# Engine-local pytest config (positioning audit 2026-08-29 §3.2): the repo-root pytest.ini only protects a run
# STARTED at the root. Started here — the way CLAUDE.md/README say to run the engine suite — pytest used to
# recurse into server-audit/ (frozen historical copies) and shareable/ (bundle snapshots) and abort at
# collection. Same exclusions as the root file; patterns match directory BASENAMES.
# --ignore is the robust form (pytest 9 still recursed into the archive with norecursedirs alone — measured).
# testpaths is the fix that actually holds: collection never enters server-audit/ or shareable/ at all.
testpaths = indicators optimize research tests test_provenance.py test_roots.py
addopts = -ra --ignore=server-audit --ignore=shareable
filterwarnings =
    ignore::DeprecationWarning:pandas.*
norecursedirs = server-audit shareable .git node_modules __pycache__ *.rsync-retired-* .venv
