name: CI

# Data-free verification gate. The price data is NOT in the repo (server-only, gitignored), so CI cannot
# run the data-dependent backtests or the golden gate — those run on the server at the dev -> main boundary
# (see AGENTS.md §4). What CI DOES catch is the most common failure mode: syntax / import / interface
# breakage (mangled edits, renamed kwargs, unmigrated call sites).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  byte-compile:
    name: Byte-compile the engine tree (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compileall (no deps needed — pure syntax gate)
        run: python -m compileall -q subprojects/Parametric-Indicators

  import-smoke:
    name: Import smoke-test the core engine (imports / interfaces)
    runs-on: ubuntu-latest
    # optimize/instruments.py eagerly loads the cross-subproject registry at import time from
    # $WSH_DATA_BASE/subprojects/all-stocks-signals/instruments.py — point it at the checkout root.
    env:
      WSH_DATA_BASE: ${{ github.workspace }}
    defaults:
      run:
        working-directory: subprojects/Parametric-Indicators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + declared deps
        run: |
          python -m pip install --upgrade pip
          # Core scientific stack the engine assumes (not pinned in requirements.txt, which only lists
          # the optimizer-dashboard extras).
          pip install numpy pandas scipy optuna
          pip install -r requirements.txt
      - name: Import the core modules (fails on any import / interface breakage)
        run: |
          python -c "
          import config, strategy, engine, presets
          import optimize.fast_engine, optimize.instruments, optimize.signals, optimize.timeframes
          from optimize.l2 import payload
          from optimize import optimizer
          from indicators import library
          print('core engine imports OK')
          "

  accelerator-parity:
    name: Accelerator parity (data-free)
    runs-on: ubuntu-latest
    # Every fast indicator path must reproduce its frozen `*_reference` oracle. These tests are
    # SYNTHETIC-DATA ONLY, so unlike the golden gate they can run here (issue #62).
    #
    # Two things this job canNOT do, so do not read it as full coverage:
    #   * the real-frame sweep (486,969 bars, whole parameter grid) needs the price data — server only,
    #     `optimize/perf/bench_budget.py`;
    #   * the 2 s worst-case BUDGET scan likewise — `bench_worstcase.py`, an END-of-round checklist step
    #     in docs/EXPANSION_ROUND_PLAYBOOK.md (it exits non-zero when something is over budget).
    #
    # Numba is deliberately NOT installed: the tests force `_HAVE_NUMBA = True` so the kernel bodies run
    # as plain Python and their LOGIC is still checked. Without that they would compare each reference
    # to itself and pass while testing nothing (playbook C11).
    env:
      WSH_DATA_BASE: ${{ github.workspace }}
    defaults:
      run:
        working-directory: subprojects/Parametric-Indicators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pytest
      - name: Parity gates
        run: |
          python -m pytest -q \
            optimize/perf/test_budget_accel_parity.py \
            optimize/perf/test_cold_accel_parity.py \
            optimize/perf/test_tail_accel_parity.py \
            tests/test_speedopt_equiv.py
